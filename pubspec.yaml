name: oxygen
description: Oxygen music player for Windows and Android
publish_to: "none"
version: 3.8.0+9

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.3
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
